name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4

      # Windows 上提交的文件没有可执行位，Linux runner 直接 ./gradlew 会 permission denied
      - name: 补可执行位
        run: chmod +x ./gradlew

      # 没配 Secrets 时跳过，产出的 APK 是未签名的（仍可验证编译是否通过）
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置 KEYSTORE_BASE64，本次产出未签名包"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # 用 printf 而不是 heredoc：YAML 块标量会吃掉缩进，heredoc 结束符很容易被带偏
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KS_STORE_PASS" "$KS_ALIAS" "$KS_KEY_PASS" \
            > keystore.properties

      - name: 解析版本号（tag v1.23 → 1.23）
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 Release
        run: |
          if [ -n "${{ steps.ver.outputs.name }}" ]; then
            ./gradlew assembleRelease -PversionName="${{ steps.ver.outputs.name }}" --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: 校验签名并改名
        run: |
          # 未配置签名时 AGP 输出的是 app-release-unsigned.apk，不能硬编码成 app-release.apk
          APK=$(ls -1 app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::在 app/build/outputs/apk/release/ 下没有找到 APK"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          echo "产物：$APK"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BT" ] && "$BT/apksigner" verify --print-certs "$APK" > /dev/null 2>&1; then
            echo "签名证书："
            "$BT/apksigner" verify --print-certs "$APK" | grep -E "SHA-256|DN"
            cp "$APK" "caoji-${GITHUB_REF_NAME}.apk"
          else
            echo "::warning::APK 未签名（未配置签名 Secrets）"
            cp "$APK" "caoji-${GITHUB_REF_NAME}-unsigned.apk"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          # 用 run_number 而不是 ref_name：分支名带 / 时 artifact 名不合法
          name: apk-${{ github.run_number }}
          path: caoji-*.apk
          if-no-files-found: error

      # 只有打 tag 才自动发 Release，普通 push 只留 artifact
      - name: 发布 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: caoji-*.apk
          generate_release_notes: true
          body: |
            草记 ${{ github.ref_name }}

            安装前请确认：本包与已安装版本签名一致，可直接覆盖升级。
            若手机提示「签名不一致」，说明装的是更早的 debug 签名版本，需先卸载
            （卸载会清空本地数据，请先在应用内导出备份）。
